<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fazoo</title>
<style>
:root{--h:#12305A;--a:#F26B3A;--t:#DCE5F2;--bg:#F7FAFC;--cd:#fff;--tx:#0B2A40;--sf:#5B6B78;--bd:#C5D3E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--h:#1B3F73;--t:#223654;--bg:#0E1726;--cd:#16233A;--tx:#E8EEF6;--sf:#9FB0C5;--bd:#2A3F5F}}
:root[data-theme="dark"]{--h:#1B3F73;--t:#223654;--bg:#0E1726;--cd:#16233A;--tx:#E8EEF6;--sf:#9FB0C5;--bd:#2A3F5F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}#app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.rl{display:flex;align-items:center;gap:6px;padding:10px 12px;font-weight:700;font-size:17px;color:var(--tx)}.rl span{flex:1}
.rl button{border:1px solid var(--bd);background:var(--cd);border-radius:99px;padding:6px 11px;font-size:12px}.rl button.on{background:var(--h);color:#fff;border-color:var(--h)}
.hd{background:var(--h);color:#fff;padding:14px 14px 16px;border-radius:0 0 18px 18px}.hd .b{font-size:17px;font-weight:700}.sub{opacity:.85;margin-top:2px}
.bk{background:none;border:0;color:#fff;padding:0 0 8px;font-size:13px}
.pd{padding:12px;display:flex;flex-direction:column;gap:9px;flex:1}h3{margin:6px 0 0;font-size:14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:6px}.tap{cursor:pointer}.tip{background:var(--t);border-color:var(--t)}
.r{display:flex;align-items:center;gap:9px}.f{flex:1}.sp{display:flex;justify-content:space-between;gap:8px}.tot{font-weight:700;font-size:16px;border-top:1px solid var(--bd);padding-top:7px}
.nt{color:var(--sf);font-size:12px}.c{text-align:center}.er{color:#C0392B;font-size:12px;min-height:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--t);color:var(--tx);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.ch{background:var(--t);color:var(--tx);border-radius:99px;padding:2px 9px;font-size:11px;white-space:nowrap}
.bt{background:var(--a);color:#fff;border:0;border-radius:99px;padding:12px;font-weight:700}.b2{background:none;border:1px solid var(--bd);border-radius:99px;padding:10px;font-weight:600}
input,select,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}textarea{min-height:70px;resize:vertical}
.steps{display:flex;flex-direction:column;gap:11px;padding:6px 2px}.mut{color:var(--sf)}
.st{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex:none}.s0{background:var(--bd)}.s1{background:var(--h)}.s2{background:var(--a)}
.chat{display:flex;flex-direction:column;gap:7px}.m1,.m2{padding:8px 10px;max-width:82%;border-radius:12px}.m1{align-self:flex-start;background:var(--cd);border:1px solid var(--bd)}.m2{align-self:flex-end;background:var(--h);color:#fff}
.msg{display:flex;gap:6px}.snd{background:var(--a);color:#fff;border:0;border-radius:99px;padding:0 14px;font-weight:700}
.stars{display:flex;justify-content:center;gap:4px}.sb{background:none;border:0;font-size:30px;color:var(--bd);padding:0}.sb.on{color:var(--a)}
.two{display:flex;gap:8px}.two .cd{flex:1}.big{font-size:18px;font-weight:700}
.ft{text-align:center;padding:14px 12px 20px;color:var(--sf);font-size:11px}.ft button{background:none;border:0;color:var(--sf);text-decoration:underline;font-size:11px}
</style></head><body><div id="app"></div>
<script>
const KEY="fazoo_v1",PRO={p:"João R.",i:"JR",n:"4,9 · 120 serviços"};
const seed=()=>({role:"c",nid:2,ps:[{id:1,t:"Instalar ar-condicionado",c:"Ar-condicionado",d:"Split 12.000 BTUs na sala, material incluso.",st:"aberto",orc:[{p:"Marcos S.",i:"MS",n:"4,8 · 86 serviços",v:2700,z:"2 dias"},{p:"Paulo T.",i:"PT",n:"4,6 · 40 serviços",v:3400,z:"3 dias"}],ac:null,ch:[],av:0,cn:false}]});
let D;try{D=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){D=seed()}
let V={n:"home"},star=5;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=v=>"R$ "+Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
const P=id=>D.ps.find(p=>p.id==id);
const ST={aberto:"Recebendo orçamentos",and:"Em andamento",fin:"Concluído",dis:"Em análise do suporte"};
const av=i=>`<div class="av">${esc(i)}</div>`;
const card=(x,c="")=>`<div class="cd ${c}">${x}</div>`;
const tap=(a,id,x)=>`<div class="cd tap" data-a="${a}" data-id="${id}">${x}</div>`;
const row=(l,r)=>`<div class="sp"><span>${l}</span><span>${r}</span></div>`;
const tip=x=>card(x,"tip");
const head=(t,s,back)=>`<div class="hd">${back?'<button class="bk" data-a="home">‹ Voltar</button>':""}<div class="b">${t}</div>${s?`<div class="sub">${s}</div>`:""}</div>`;
const bar=()=>`<div class="rl"><span>Fazoo</span><button class="${D.role=="c"?"on":""}" data-a="role" data-w="c">Sou cliente</button><button class="${D.role=="p"?"on":""}" data-a="role" data-w="p">Sou profissional</button></div>`;
const steps=(p,me)=>{const a=p.ac!=null,f=p.st=="fin",o=a?p.orc[p.ac]:null;
const L=[["Pedido publicado",1],[a?"Orçamento aceito · "+esc(o.p):"Orçamento aceito",a?1:0],[a?"Pagamento retido · "+R(me=="p"?o.v:o.v*1.1):"Pagamento retido",a?1:0],["Em execução",f?1:a?(p.cn?1:2):0],["Concluído",f?1:p.cn?2:0]];
return `<div class="steps">`+L.map(([t,s])=>`<div class="r${s?"":" mut"}"><span class="st s${s}">${s==1?"✓":""}</span>${s==2?`<b>${t}</b>`:t}</div>`).join("")+"</div>"};
const chat=(p,me)=>`<h3>Conversa</h3><div class="chat">${p.ch.length?p.ch.map(m=>`<div class="${m.w==me?"m2":"m1"}">${esc(m.t)}</div>`).join(""):'<div class="nt">Nenhuma mensagem ainda.</div>'}</div><div class="msg"><input id="mi" placeholder="Escreva uma mensagem" maxlength="300"><button class="snd" data-a="msg" data-w="${me}" data-id="${p.id}">Enviar</button></div>`;
function svc(p,me){let h=steps(p,me),o=p.orc[p.ac];
if(me=="c"){
if(p.st=="and"&&p.cn)h+=card(`<b>${esc(o.p)} marcou o serviço como concluído.</b><div class="nt">Confirme para liberar ${R(o.v)} ao profissional.</div>`)+`<button class="bt" data-a="ok" data-id="${p.id}">Confirmar e liberar pagamento</button><button class="b2" data-a="dis" data-id="${p.id}">Algo deu errado</button>`;
else if(p.st=="and")h+=tip("Seu dinheiro está protegido até você confirmar a conclusão.");
if(p.st=="dis")h+=tip("O suporte foi acionado e vai conversar com os dois lados para definir a melhor solução.");
if(p.st=="fin"){h+=tip("Pagamento liberado ao profissional.");
h+=p.av?card(`<div class="c"><span style="color:var(--a);font-size:22px">${"★".repeat(p.av)}</span><div class="nt">${p.avt?"“"+esc(p.avt)+"”":"Obrigado pela avaliação."}</div></div>`):card(`<b class="c">Como foi com ${esc(o.p)}?</b><div class="stars">${[1,2,3,4,5].map(n=>`<button class="sb on" data-a="star" data-n="${n}">★</button>`).join("")}</div><input id="rc" placeholder="Conte como foi o serviço" maxlength="200">`)+(p.av?"":`<button class="bt" data-a="rate" data-id="${p.id}">Enviar avaliação</button>`)}
}else{
if(p.st=="and"&&!p.cn)h+=`<button class="bt" data-a="done" data-id="${p.id}">Marcar como concluído</button>`;
else if(p.st=="and")h+=tip("Aguardando o cliente confirmar a conclusão. O pagamento será liberado em seguida.");
if(p.st=="dis")h+=tip("O suporte foi acionado e vai conversar com você e com o cliente.");
if(p.st=="fin")h+=tip(`Pagamento liberado: ${R(o.v)}.`)}
return h+chat(p,me)}
const homeC=()=>head("Olá, Ana","Seus pedidos")+`<div class="pd"><button class="bt" data-a="new">+ Novo pedido</button>`+(D.ps.map(p=>tap("open",p.id,`<div class="sp"><b>${esc(p.t)}</b><span class="ch">${ST[p.st]}</span></div><div class="nt">${p.ac!=null?esc(p.orc[p.ac].p):p.orc.length+" orçamento(s) recebido(s)"}</div>`)).join("")||'<div class="nt c">Você ainda não publicou pedidos.</div>')+"</div>";
const newC=()=>head("Novo pedido","Descreva o que você precisa",1)+`<div class="pd"><select id="cat"><option>Ar-condicionado</option><option>Reparo elétrico</option><option>Encanamento</option><option>Construção civil</option><option>Pintura</option></select><input id="t" placeholder="Ex.: Trocar tomadas do quarto" maxlength="80"><textarea id="d" placeholder="Detalhes do serviço" maxlength="400"></textarea><div class="nt">Fotos, vídeos e áudios entram numa próxima versão.</div><div class="er" id="er"></div><button class="bt" data-a="pub">Publicar pedido</button></div>`;
const detC=p=>head(esc(p.t),ST[p.st],1)+`<div class="pd">`+card(`<div class="nt">${esc(p.c)}</div>${esc(p.d||"Sem detalhes.")}`)+(p.st=="aberto"?`<h3>Orçamentos</h3>`+(p.orc.map((o,i)=>card(`<div class="r">${av(o.i)}<div class="f"><b>${esc(o.p)}</b><div class="nt">${esc(o.n)} · ${esc(o.z)}</div></div><b>${R(o.v)}</b></div>${o.m?`<div class="nt">“${esc(o.m)}”</div>`:""}<button class="b2" data-a="acc" data-id="${p.id}" data-i="${i}">Aceitar este orçamento</button>`)).join("")||'<div class="nt">Aguardando profissionais…</div>'):svc(p,"c"))+"</div>";
const payC=(p,i)=>{const o=p.orc[i];return head("Pagamento",esc(p.t),1)+`<div class="pd">`+card(`<div class="r">${av(o.i)}<b>${esc(o.p)}</b></div>`)+card(row("Orçamento",R(o.v))+row("Taxa Fazoo (10%)",R(o.v*.1))+`<div class="sp tot"><span>Total</span><span>${R(o.v*1.1)}</span></div>`)+tip("O dinheiro fica retido e só é liberado quando você confirmar a conclusão.")+`<button class="bt" data-a="pay" data-id="${p.id}" data-i="${i}">Pagar com Mercado Pago (simulado)</button><div class="nt c">Nenhuma cobrança real é feita.</div></div>`};
const mine=p=>p.ac!=null&&p.orc[p.ac].p==PRO.p;
function homeP(){const n=D.ps.filter(p=>p.st=="aberto"&&!p.orc.some(o=>o.p==PRO.p)),e=D.ps.filter(p=>p.st=="aberto"&&p.orc.some(o=>o.p==PRO.p)),m=D.ps.filter(mine);
const sum=f=>m.filter(f).reduce((s,p)=>s+p.orc[p.ac].v,0);
return head("Olá, João","Painel do profissional")+`<div class="pd"><div class="two"><div class="cd"><div class="nt">Retido</div><div class="big">${R(sum(p=>p.st=="and"||p.st=="dis"))}</div></div><div class="cd"><div class="nt">Liberado</div><div class="big">${R(sum(p=>p.st=="fin"))}</div></div></div><h3>Novos pedidos</h3>`+(n.map(p=>tap("pq",p.id,`<div class="sp"><b>${esc(p.t)}</b><span class="ch">novo</span></div><div class="nt">${esc(p.c)} · ${p.orc.length} orçamento(s) já enviados</div>`)).join("")||'<div class="nt">Nenhum pedido novo no momento.</div>')+(e.length?"<h3>Orçamentos enviados</h3>"+e.map(p=>card(`<b>${esc(p.t)}</b><div class="nt">Aguardando o cliente decidir.</div>`)).join(""):"")+(m.length?"<h3>Meus serviços</h3>"+m.map(p=>tap("open",p.id,`<div class="sp"><b>${esc(p.t)}</b><span class="ch">${ST[p.st]}</span></div><div class="nt">${R(p.orc[p.ac].v)}</div>`)).join(""):"")+"</div>"}
const qP=p=>head("Enviar orçamento",esc(p.t),1)+`<div class="pd">`+card(`<div class="nt">${esc(p.c)}</div>${esc(p.d||"Sem detalhes.")}`)+`<input id="qv" type="number" inputmode="numeric" min="1" placeholder="Valor do serviço (R$)"><input id="qz" placeholder="Prazo. Ex.: 2 dias" maxlength="30"><textarea id="qm" placeholder="Mensagem para o cliente" maxlength="300"></textarea>`+tip("Você recebe o valor integral do orçamento. A taxa de 10% é paga pelo cliente.")+`<div class="er" id="er"></div><button class="bt" data-a="quote" data-id="${p.id}">Enviar orçamento</button></div>`;
const detP=p=>head(esc(p.t),ST[p.st],1)+`<div class="pd">`+card(`<div class="nt">${esc(p.c)}</div>${esc(p.d||"Sem detalhes.")}`)+svc(p,"p")+"</div>";
function render(){const c=D.role=="c";let h="";const p=V.id&&P(V.id);
if(V.n=="new"&&c)h=newC();else if(V.n=="pay"&&c&&p)h=payC(p,V.i);else if(V.n=="q"&&!c&&p)h=qP(p);else if(V.n=="det"&&p)h=c?detC(p):detP(p);else h=c?homeC():homeP();
$("#app").innerHTML=bar()+h+`<div class="ft">Protótipo de demonstração. Pagamento simulado.<br><button data-a="reset">Reiniciar demonstração</button></div>`;window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,p=id&&P(id);
switch(a){
case"role":D.role=b.dataset.w;V={n:"home"};break;
case"home":V={n:"home"};break;
case"new":V={n:"new"};break;
case"open":V={n:"det",id};break;
case"pq":V={n:"q",id};break;
case"pub":{const t=$("#t").value.trim();if(!t){$("#er").textContent="Informe o que você precisa.";return}
const base=(Math.floor(Math.random()*25)+5)*100,nid=D.nid++;
D.ps.unshift({id:nid,t,c:$("#cat").value,d:$("#d").value.trim(),st:"aberto",orc:[{p:"Marcos S.",i:"MS",n:"4,8 · 86 serviços",v:base,z:"2 dias"},{p:"Paulo T.",i:"PT",n:"4,6 · 40 serviços",v:Math.round(base*1.2/10)*10,z:"3 dias"}],ac:null,ch:[],av:0,cn:false});V={n:"det",id:nid};break}
case"acc":V={n:"pay",id,i:+b.dataset.i};break;
case"pay":p.ac=+b.dataset.i;p.st="and";V={n:"det",id};break;
case"quote":{const v=+$("#qv").value;if(!(v>0)){$("#er").textContent="Informe o valor do serviço.";return}
p.orc.push({p:PRO.p,i:PRO.i,n:PRO.n,v:Math.round(v),z:$("#qz").value.trim()||"A combinar",m:$("#qm").value.trim()});V={n:"home"};break}
case"msg":{const t=$("#mi").value.trim();if(!t)return;p.ch.push({w:b.dataset.w,t});break}
case"done":p.cn=true;break;
case"ok":p.st="fin";break;
case"dis":p.st="dis";break;
case"star":star=+b.dataset.n;document.querySelectorAll(".sb").forEach(x=>x.classList.toggle("on",+x.dataset.n<=star));return;
case"rate":p.av=star;p.avt=($("#rc")||{value:""}).value.trim();break;
case"reset":D=seed();V={n:"home"};break;
default:return}
save();render()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="mi"){const b=$('[data-a="msg"]');if(b)b.click()}});
render();
</script></body></html>
