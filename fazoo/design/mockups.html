<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazoo · Mockups</title><style>
:root{--h:#12305A;--a:#F26B3A;--t:#DCE5F2;--bg:#F7FAFC;--tx:#0B2A40;--sf:#5B6B78}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#EEF2F6;color:var(--tx);padding:24px 16px 48px}
header,section{max-width:1100px;margin:0 auto}

.lead{color:var(--sf);margin:0 0 18px}
.brand{display:flex;gap:24px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--t);border-radius:16px;padding:18px}

.chips{display:flex;gap:6px;padding:10px 11px 8px}.ch{background:var(--t);color:var(--h);border-radius:99px;padding:4px 10px}.ch.on{background:var(--h);color:#fff}

.media{display:flex;gap:6px;margin:6px 11px}.media span{flex:1;background:var(--t);color:var(--h);text-align:center;border-radius:10px;padding:14px 0;font-weight:600}
